name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package and publish (e.g. v1.1.6-bobbyleu.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: ZIP Component Dir
        run: |
          cd "${{ github.workspace }}/custom_components/xiaomi_miot"
          zip -r "${{ github.workspace }}/xiaomi_miot.zip" ./

      - name: Publish release with zip asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: xiaomi_miot.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            Fork build of [al-one/hass-xiaomi-miot](https://github.com/al-one/hass-xiaomi-miot),
            maintained by [bobbyleu](https://github.com/bobbyleu/hass-xiaomi-miot).

            Changes and the `<upstream>-bobbyleu.<N>` versioning scheme are documented in
            [README → About this fork](https://github.com/bobbyleu/hass-xiaomi-miot#about-this-fork).
